services:
  radflow-sentinel:
    build: .
    container_name: radflow-sentinel
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUDIT_SECRET_KEY: ${AUDIT_SECRET_KEY:?Set AUDIT_SECRET_KEY before running}
      RADFLOW_API_TOKEN: ${RADFLOW_API_TOKEN:?Set RADFLOW_API_TOKEN before running}
      MODEL_PROVIDER: mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
